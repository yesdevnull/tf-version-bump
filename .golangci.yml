version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    staticcheck:
      # ST1005 wants lower-case error strings; the CLI prints its errors verbatim as diagnostics,
      # so they are capitalised sentences on purpose.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

issues:
  max-same-issues: 0
