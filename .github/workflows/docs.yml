name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.md'
      - 'examples/**/*.yml'
      - 'schema/config-schema.json'
      - 'documentation_test.go'
      - 'config_schema_test.go'
      - 'Makefile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.md'
      - 'examples/**/*.yml'
      - 'schema/config-schema.json'
      - 'documentation_test.go'
      - 'config_schema_test.go'
      - 'Makefile'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  check:
    name: Check documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.8"
          cache: true

      - name: Check documentation
        run: make docs-check
