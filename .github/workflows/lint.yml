name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      # shellcheck publishes no checksum files; this matches GitHub's recorded digest for the asset.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26.8"
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

    # actionlint runs shellcheck over run: blocks using the first shellcheck on PATH, so the
    # pinned release is installed before it rather than relying on the runner image's package.
    - name: Install pinned shellcheck
      run: |
        archive="$RUNNER_TEMP/shellcheck.tar.xz"
        curl --fail --silent --show-error --location --output "$archive" \
          "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
        printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --status
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"

    - name: Confirm pinned shellcheck is first on PATH
      run: |
        shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"

    - name: Run actionlint
      run: make actionlint

    - name: Run shellcheck
      run: make shellcheck
