name: Terraform version bump configuration validation

on:
  pull_request:
    paths:
      - .github/tf-version-bump/nonproduction.yml
      - .github/tf-version-bump/production.yml

permissions:
  contents: read

jobs:
  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify tf-version-bump
        run: |
          archive_path="$RUNNER_TEMP/tf-version-bump_1.0.0-rc.11_linux_x86_64.tar.gz"
          tool_directory="$RUNNER_TEMP/tf-version-bump-config-validation"
          rm -rf -- "$archive_path" "$tool_directory"
          mkdir -p -- "$tool_directory"
          curl --fail --silent --show-error --location \
            --output "$archive_path" \
            https://github.com/yesdevnull/tf-version-bump/releases/download/v1.0.0-rc.11/tf-version-bump_1.0.0-rc.11_linux_x86_64.tar.gz
          printf '%s  %s\n' \
            5560b45e220650e8b18d5836eff05d471f602a6ac970aeeb9628781797f54c85 \
            "$archive_path" | sha256sum --check --status
          tar -xzf "$archive_path" -C "$tool_directory"
          version_output=$("$tool_directory/tf-version-bump" -version)
          [[ "${version_output%%$'\n'*}" == "tf-version-bump 1.0.0-rc.11" ]]
          printf 'TF_VERSION_BUMP_BINARY=%s\n' "$tool_directory/tf-version-bump" >> "$GITHUB_ENV"
      - name: Validate configuration
        run: |
          for config in \
            .github/tf-version-bump/nonproduction.yml \
            .github/tf-version-bump/production.yml; do
            "$TF_VERSION_BUMP_BINARY" -validate-config "$config"
          done
      - name: Remove downloaded tf-version-bump
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/tf-version-bump_1.0.0-rc.11_linux_x86_64.tar.gz" "$RUNNER_TEMP/tf-version-bump-config-validation"
