name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Run branch automation tests
      run: examples/update-branches_test.sh

    - name: Install GitHub Actions POC test prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes bash curl git jq

    - name: Check Docker test infrastructure availability
      run: docker version

    - name: Run GitHub Actions POC checks
      run: make test-github-actions

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26'

    - name: Build for Linux
      run: |
        GOOS=linux GOARCH=amd64 go build -o tf-version-bump-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -o tf-version-bump-linux-arm64 .

    - name: Build for macOS
      run: |
        GOOS=darwin GOARCH=amd64 go build -o tf-version-bump-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o tf-version-bump-darwin-arm64 .

    - name: Build for Windows
      run: |
        GOOS=windows GOARCH=amd64 go build -o tf-version-bump-windows-amd64.exe .
        GOOS=windows GOARCH=arm64 go build -o tf-version-bump-windows-arm64.exe .

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: binaries
        path: |
          tf-version-bump-*
        retention-days: 30
